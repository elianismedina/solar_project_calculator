{% extends 'design/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-warning">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">Remove Component from Project</h4>
            </div>
            <div class="card-body">
                <p>Are you sure you want to remove <strong>"{{ object }}"</strong> from this project?</p>
                
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-warning">Remove from Project</button>
                    <a href="{% url 'project_detail' object.project.pk %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
